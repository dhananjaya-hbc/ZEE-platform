name: AI Service CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/ai-service/**'
      - '.github/workflows/ai-service-ci.yml'
  push:
    branches: [main, dev]
    paths:
      - 'apps/ai-service/**'
      - '.github/workflows/ai-service-ci.yml'

concurrency:
  group: ai-service-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/ai-service

jobs:
  lint-and-test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile. Testing on a different version than you ship
          # is how you find out about an incompatibility in production.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ai-service/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Typecheck
        run: mypy app
        continue-on-error: true # TODO: drop once the stubs are implemented and typed.

      - name: Test
        env:
          # Fake value; no test reaches a real service. Settings require this to
          # be present, so the app cannot even be imported without it.
          INTERNAL_API_KEY: ci-internal-key-not-a-real-secret
          ENVIRONMENT: development
        run: pytest -q
