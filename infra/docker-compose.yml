# ZEE — local development stack.
#
#   docker compose -f infra/docker-compose.yml up --build
#
# Brings up PostgreSQL (with pgvector), Redis, and all three services on one
# network. Copy infra/.env.example to infra/.env first.

name: zee

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL with pgvector.
  #
  # The pgvector image is used from day one even though Phase 1 stores no
  # embeddings. Swapping the image later would mean recreating the volume, and
  # the extension costs nothing while unused.
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: zee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zee}
      POSTGRES_DB: ${POSTGRES_DB:-zee}
    ports:
      # Published so you can point psql or a GUI at it from the host.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs ONCE, on first initialisation of an empty data directory. If you
      # change it later you must `docker compose down -v` for it to run again.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      # Other services wait on this. Without it they start racing an
      # unready database and fail their first connection.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zee} -d ${POSTGRES_DB:-zee}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [zee-net]

  # ---------------------------------------------------------------------------
  # Redis — caching and background job queue.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: zee-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [zee-net]

  # ---------------------------------------------------------------------------
  # AI service (Python / FastAPI).
  #
  # NOTE the port mapping: bound to 127.0.0.1 so it is reachable from your
  # machine for /docs, but never from the wider network. In production this
  # service gets no published port at all — only the API talks to it.
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ../apps/ai-service
      dockerfile: Dockerfile
    container_name: zee-ai-service
    restart: unless-stopped
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required - see infra/.env.example}
      DATABASE_URL: postgresql://${POSTGRES_USER:-zee}:${POSTGRES_PASSWORD:-zee}@postgres:5432/${POSTGRES_DB:-zee}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [zee-net]

  # ---------------------------------------------------------------------------
  # Main API (.NET).
  #
  # Reaches the AI service at http://ai-service:8000 — Compose's DNS resolves
  # service names on the shared network, so no IPs or host ports are involved.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: zee-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-zee};Username=${POSTGRES_USER:-zee};Password=${POSTGRES_PASSWORD:-zee}
      ConnectionStrings__Redis: redis:6379
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required - see infra/.env.example}
      Jwt__Issuer: ${JWT_ISSUER:-zee}
      AiService__BaseUrl: http://ai-service:8000
      AiService__InternalKey: ${INTERNAL_API_KEY}
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        # started, not healthy: the API must come up even when the AI service is
        # down. Every AI call has a fallback, so blocking startup on it would make
        # an optional dependency a hard one.
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [zee-net]

  # ---------------------------------------------------------------------------
  # Web app (Next.js).
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        # Baked in at BUILD time, not runtime: Next inlines NEXT_PUBLIC_* values
        # into the client bundle, so changing this later needs a rebuild.
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:5080}
    container_name: zee-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    networks: [zee-net]

volumes:
  postgres-data:
  redis-data:

networks:
  zee-net:
    driver: bridge
